name: Release Desktop

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'synth-sh/desktop'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Find a successful main build for the tagged commit
        id: main-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse 'HEAD^{commit}')
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tests.yml \
            --branch main --event push --commit "$commit" --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::error::No successful Build and Test run on main for $commit. Wait for or rerun that build, then rerun this release."
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the tested app
        id: download
        uses: actions/download-artifact@v8
        with:
          name: tested-synth-app
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.main-build.outputs.run-id }}

      - name: Explain how to recover a missing artifact
        if: failure() && steps.download.outcome == 'failure'
        run: echo '::error::Could not download the tested app. If it is missing or expired, rerun Build and Test for the tagged commit or see docs/releasing.md.'

      - name: Unpack the tested app and check its version
        run: |
          ditto -x -k "$RUNNER_TEMP/tested-synth-app.zip" "$RUNNER_TEMP"
          version=$(plutil -extract CFBundleShortVersionString raw "$RUNNER_TEMP/Synth.app/Contents/Info.plist")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME differs from app version $version"
            exit 1
          fi

      - name: Sign and notarize the release archive
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: Scripts/package-release.sh "$RUNNER_TEMP/Synth.app" "synth-desktop-${GITHUB_REF_NAME#v}-macos-arm64.zip"

      - name: Download and verify Sparkle signing tools
        run: |
          mkdir -p "$RUNNER_TEMP/sparkle"
          cd "$RUNNER_TEMP/sparkle"
          curl --fail --silent --show-error --location --retry 3 --output sparkle.zip \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-for-Swift-Package-Manager.zip
          echo '4c2e48a3e50ebcc2c88a58a4c7264a1a99c3c31857ce754357afb9cdb323022a  sparkle.zip' | shasum -a 256 --check
          ditto -x -k sparkle.zip .

      - name: Sign final ZIP for Sparkle
        shell: bash
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          : "${SPARKLE_ED_PRIVATE_KEY:?Set the SPARKLE_ED_PRIVATE_KEY Actions secret}"
          archive="synth-desktop-${GITHUB_REF_NAME#v}-macos-arm64.zip"
          # sign_update can echo malformed key input; don't log its failure output.
          if ! attributes=$(printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" |
            "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - "$archive" 2>/dev/null); then
            echo '::error::Sparkle signing failed. Check the exported key and release ZIP.'
            exit 1
          fi
          printf '### Sparkle appcast enclosure\n\n`%s`: `%s`\n' "$archive" "$attributes" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "synth-desktop-${GITHUB_REF_NAME#v}-macos-arm64.zip" \
            --verify-tag --title "Synth Desktop $GITHUB_REF_NAME" --generate-notes
