name: Verify Desktop signing

on:
  push:
    branches:
      - codex/desktop-signing-smoke

permissions:
  contents: read

concurrency:
  group: desktop-signing-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'synth-sh/desktop'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP: DerivedData/Build/Products/Release/Synth.app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install build tools
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v swiftlint >/dev/null || brew install swiftlint

      - name: Lint Swift
        run: swiftlint lint --strict

      - name: Build app and check version
        run: |
          Scripts/build-app.sh
          version=$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")
          if [ "v$version" != "v0.1.0" ]; then
            echo "::error::Test release version v0.1.0 differs from app version $version"
            exit 1
          fi

      - name: Test with the bundled engine
        run: python3 Tests/Fixtures/fake_provider.py "$APP/Contents/Helpers/synth"

      - name: Sign and notarize the release archive
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: Scripts/package-release.sh "$APP" synth-desktop-0.1.0-macos-arm64.zip

      - name: Verify the packaged app
        run: |
          set -euo pipefail
          extracted=$(mktemp -d)
          ditto -x -k synth-desktop-0.1.0-macos-arm64.zip "$extracted"
          codesign --verify --deep --strict --verbose=2 "$extracted/Synth.app"
          xcrun stapler validate "$extracted/Synth.app"
