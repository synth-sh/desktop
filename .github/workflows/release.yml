name: Release Desktop

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'synth-sh/desktop'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      APP: DerivedData/Build/Products/Release/Synth.app
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install build tools
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v swiftlint >/dev/null || brew install swiftlint

      - name: Lint Swift
        run: swiftlint lint --strict

      - name: Build app and check version
        run: |
          Scripts/build-app.sh
          version=$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME differs from app version $version"
            exit 1
          fi

      - name: Test with the bundled engine
        run: python3 Tests/Fixtures/fake_provider.py "$APP/Contents/Helpers/synth"

      - name: Sign and notarize the release archive
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: Scripts/package-release.sh "$APP" "synth-desktop-${GITHUB_REF_NAME#v}-macos-arm64.zip"

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "synth-desktop-${GITHUB_REF_NAME#v}-macos-arm64.zip" \
            --verify-tag --title "Synth Desktop $GITHUB_REF_NAME" --generate-notes
