name: Synth
options:
  defaultConfig: Release
  settingPresets: none
  xcodeVersion: "26.2"

packages:
  SynthDesktop:
    path: .
  MarkdownEngine:
    url: https://github.com/synth-sh/swift-markdown-engine.git
    revision: "0c65a2fa6cc6e45fee04538c61dc26ca559683bf"
  Ghostty:
    url: https://github.com/Lakr233/libghostty-spm.git
    exactVersion: "2.2.2026111701"

targets:
  Synth:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: App
        type: syncedFolder
      - path: Assets.xcassets
        buildPhase: resources
      - path: Licenses/MarkdownEngine.txt
        buildPhase: resources
      - path: Licenses/Ghostty.txt
        buildPhase: resources
    dependencies:
      - package: SynthDesktop
        product: SynthClient
      - package: SynthDesktop
        product: SynthProtocol
      - package: MarkdownEngine
        product: MarkdownEngine
      - package: MarkdownEngine
        product: MarkdownEngineCodeBlocks
      - package: Ghostty
        product: GhosttyTerminal
    settings:
      base:
        ARCHS: arm64
        SDKROOT: macosx
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ALWAYS_SEARCH_USER_PATHS: "NO"
        ENABLE_APP_SANDBOX: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "0.2.3"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: Synth
        PRODUCT_BUNDLE_IDENTIFIER: sh.getsynth.desktop
        SYNTH_ENGINE: $(SRCROOT)/DerivedData/engine/bin/synth
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Synth
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
    postBuildScripts:
      - name: Embed Synth engine
        inputFiles:
          - $(SYNTH_ENGINE)
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/synth
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/SynthEngineVersion.txt
        script: |
          set -eu
          if [ ! -x "$SYNTH_ENGINE" ]; then
              echo "error: Build the ReleaseSafe engine with Scripts/build-app.sh or set SYNTH_ENGINE."
              exit 1
          fi
          destination="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          resources="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$destination" "$resources"
          install -m 755 "$SYNTH_ENGINE" "$destination/synth"
          codesign --force --sign - "$destination/synth"
          version=$("$destination/synth" --version) || version=
          printf '%s\n' "${version#synth }" > "$resources/SynthEngineVersion.txt"

schemes:
  Synth:
    build:
      targets:
        Synth: all
    run:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Release
